name: Release APWorld
on:
  push:
    tags:
      - '**'

env:
  AP_VERSION: '0.6.8'
  PYTHON_VERSION: '3.13'

jobs:
  variant:
    runs-on: ubuntu-latest
    outputs:
      apworld-name: ${{ steps.v.outputs.apworld-name }}
    steps:
      - id: v
        run: |
            echo "apworld-name=best_trainer" >> "$GITHUB_OUTPUT"

  package:
    runs-on: ubuntu-latest
    needs: variant
    steps:
      - uses: Eijebong/ap-actions/package-apworld@main
        id: apworld
        with:
          checkout: false
          path: worlds/best_trainer
          apworld-name: ${{ needs.variant.outputs.apworld-name }}
          ap-version: ${{ env.AP_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: apworld
          path: ${{ steps.apworld.outputs.apworld }}

  template:
    runs-on: ubuntu-latest
    needs: [variant, package]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apworld
      - uses: Eijebong/ap-actions/generate-template@main
        id: template
        with:
          checkout: false
          apworld-path: ${{ needs.variant.outputs.apworld-name }}.apworld
          ap-version: ${{ env.AP_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: template
          path: ${{ steps.template.outputs.template }}

  publish:
    runs-on: ubuntu-latest
    needs: [variant, template]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apworld
      - uses: actions/download-artifact@v4
        with:
          name: template
      - uses: ncipollo/release-action@v1
        with:
          artifacts: '*'
          allowUpdates: true
          immutableCreate: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true